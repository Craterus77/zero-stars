name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zerostars
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zerostars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerostars"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: SQLite smoke and deployment tests
        run: npm test

      - name: Postgres smoke and deployment tests
        env:
          TEST_DATABASE_URL: postgresql://zerostars:ci-only-password@127.0.0.1:5432/zerostars
        run: npm test
